name: 'Check syntax'

on:
  pull_request:
    branches:
      - main

jobs:
  check_syntax:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4
      - name: 'Install SQLFluff'
        run: pip install sqlfluff
      - name: 'Lint sql'
        run: sqlfluff lint ./scripts --dialect  postgres
